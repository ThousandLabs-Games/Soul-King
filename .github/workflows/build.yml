name: Compiler l'APK

on:
  push:
    branches: [ main, 'test/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Le mot de passe de la clé de signature est un « secret » GitHub (Settings › Secrets and variables › Actions) :
      # il n'apparaît jamais dans le dépôt. Le fichier signing/soulking.p12 est chiffré avec ce mot de passe.
      - name: Compiler
        env:
          SK_KEYSTORE: ${{ github.workspace }}/signing/soulking.p12
          SK_STORE_PASSWORD: ${{ secrets.SK_SIGNING_PASSWORD }}
          SK_KEY_PASSWORD: ${{ secrets.SK_SIGNING_PASSWORD }}
          SK_KEY_ALIAS: soulking
        run: |
          if [ -z "$SK_STORE_PASSWORD" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then echo "::error::Secret SK_SIGNING_PASSWORD manquant : ajoutez-le dans Settings › Secrets and variables › Actions."; exit 1; fi
            echo "::warning::Branche de test sans secret : APK de contrôle signé avec la clé de debug (jamais publié)."; unset SK_KEYSTORE
          fi
          chmod +x gradlew
          ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Préparer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk SoulKing.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SoulKing
          path: SoulKing.apk

      - name: Publier la version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          MSG=$(git log -1 --pretty=%s)
          gh release create "$TAG" SoulKing.apk --title "Soul King $TAG" --notes "$MSG" --latest
